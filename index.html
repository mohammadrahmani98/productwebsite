<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lista Spesa Ristorante</title>
<meta name="color-scheme" content="light dark">
<style>
  :root{
    --bg:#f7f7f8; --card:#ffffff; --text:#1f2328; --muted:#6b7280; --border:#e6e6e9;
    --ok:#0a7a24; --ok-bg:#ecf9f0; --low:#8a6a00; --low-bg:#fff8e1; --buy:#b00020; --buy-bg:#fff2f4;
    --chip:#f1f5f9; --shadow:0 1px 2px rgba(0,0,0,.05), 0 4px 12px rgba(0,0,0,.06);
    --exp-ok:#64748b; --exp-soon:#b45309; --exp-bad:#b91c1c;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1115; --card:#151922; --text:#e5e7eb; --muted:#9aa3b2; --border:#202637; --chip:#1c2231;
      --ok-bg:rgba(10,122,36,.12); --low-bg:rgba(138,106,0,.12); --buy-bg:rgba(176,0,32,.12);
      --shadow:none; --exp-ok:#94a3b8; --exp-soon:#f59e0b; --exp-bad:#f87171;
    }
  }
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:960px;margin:0 auto;padding:18px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 12px}
  h1{font-size:clamp(18px,2.4vw,26px);margin:0;letter-spacing:.2px}
  .controls{position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 0 12px;border-bottom:1px solid var(--border)}
  .bar{display:grid;grid-template-columns:1fr auto;gap:10px}
  .search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:15px;box-shadow:var(--shadow)}
  .filters{display:flex;flex-wrap:wrap;gap:8px}
  .btn{border:1px solid var(--border);background:var(--card);color:var(--text);padding:8px 12px;border-radius:999px;font-size:14px;cursor:pointer;box-shadow:var(--shadow)}
  .btn[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
  section.card{background:var(--card);border:1px solid var(--border);border-radius:14px;margin:14px 0 18px;overflow:hidden;box-shadow:var(--shadow)}
  details>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  details>summary::-webkit-details-marker{display:none}
  .cat-title{font-weight:600;letter-spacing:.3px}
  .cat-meta{color:var(--muted);font-size:13px}
  .rotate{transition:transform .25s ease}
  details[open] .rotate{transform:rotate(180deg)}
  ul.items{list-style:none;margin:0;padding:0}
  li.item{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:12px 16px;border-top:1px dashed var(--border)}
  .name{font-size:15px}
  .qty{font-size:14px;opacity:.85;font-variant-numeric:tabular-nums}
  .right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;min-width:240px}
  .pill{font-size:11px;padding:4px 8px;border-radius:999px;border:1px solid currentColor}
  .OK{color:var(--ok);background:var(--ok-bg)}
  .LOW{color:var(--low);background:var(--low-bg)}
  .TOBUY{color:var(--buy);background:var(--buy-bg)}
  .exp{font-size:12px}
  .exp.ok{color:var(--exp-ok)}
  .exp.soon{color:var(--exp-soon)}
  .exp.bad{color:var(--exp-bad)}
  .hide{display:none!important}
  .footer{font-size:12px;color:var(--muted);text-align:center;padding:16px 4px 8px}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Lista Spesa Ristorante</h1></header>

  <div class="controls">
    <div class="bar">
      <input id="q" class="search" type="search" placeholder="Cerca ingrediente… (es. mozza, patate)" autocomplete="off">
      <div class="filters" role="group" aria-label="Filtri">
        <button class="btn" data-filter="ALL" aria-pressed="true">Tutti</button>
        <button class="btn" data-filter="TOBUY" aria-pressed="false">Da comprare</button>
        <button class="btn" data-filter="LOW" aria-pressed="false">Scorta bassa</button>
        <button class="btn" data-filter="OK" aria-pressed="false">OK</button>
      </div>
    </div>
  </div>

  <main id="content"></main>

  <div class="footer">Ultimo aggiornamento: <span id="ts"></span></div>
</div>

<script>
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const debounce=(fn,w=200)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),w)}}
const FILTER_KEY='lista_filter';
const csvURL="https://docs.google.com/spreadsheets/d/e/2PACX-1vR_47fXphJabrRkzz_LeCJGewnhZbVhOZQqlLMzhNjjHgElbMjMNRRUI8G-DdnfTU5VJ_PtZH4hvigM/pub?gid=342807907&single=true&output=csv";

document.addEventListener('DOMContentLoaded',()=>{
  $('#ts').textContent = new Date().toLocaleString();
  const search=$('#q'); const btns=$$('.btn');
  let activeFilter=localStorage.getItem(FILTER_KEY)||'ALL';

  function setPressed(which){ btns.forEach(b=>b.setAttribute('aria-pressed', b.dataset.filter===which?'true':'false')); }
  function labelFor(s){ return s==='TOBUY'?'DA COMPRARE':(s==='LOW'?'SCORTA BASSA':'OK'); }

  function daysUntil(dStr){
    if(!dStr) return null;
    let d;
    if(/^\d{2}\/\d{2}\/\d{4}$/.test(dStr)){ const [dd,mm,yy]=dStr.split('/'); d=new Date(+yy,+mm-1,+dd); }
    else if(/^\d{4}-\d{2}-\d{2}$/.test(dStr)){ const [yy,mm,dd]=dStr.split('-'); d=new Date(+yy,+mm-1,+dd); }
    else { return null; }
    const now=new Date(); now.setHours(0,0,0,0);
    const one=86400000; return Math.floor((d-now)/one);
  }
  function expClass(dStr){
    const n=daysUntil(dStr);
    if(n===null) return 'ok';
    if(n<0) return 'bad';
    if(n<=3) return 'soon';
    return 'ok';
  }

  function sectionFor(cat, items){
    const sect=document.createElement('section'); sect.className='card';
    sect.innerHTML=`<details open><summary><span class="cat-title">${cat}</span><span class="cat-meta"><svg class="rotate" width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></summary><ul class="items"></ul></details>`;
    const ul=$('ul.items', sect);
    items.forEach(it=>{
      const li=document.createElement('li'); li.className='item'; li.dataset.status=(it.Stato||'OK'); li.dataset.name=(it.Nome||'').toLowerCase();
      const qty = it['Quantità']||''; const scad = it['Scadenza']||'';
      li.innerHTML = `<div class="name">${it.Nome}</div>
        <div class="right">
          <span class="qty">${qty}</span>
          ${scad?`<span class="exp ${expClass(scad)}">${scad}</span>`:''}
          <span class="pill ${(it.Stato||'OK')}">${labelFor(it.Stato||'OK')}</span>
        </div>`;
      ul.appendChild(li);
    });
    return sect;
  }

  function render(records){
    const content=$('#content'); content.innerHTML='';
    const byCat={}; records.forEach(r=>{ (byCat[r.Categoria||'ALTRO'] ||= []).push(r); });
    const order=['LATTICINI','VERDURE E ORTAGGI','CARNE','SALUMI','PANE','PASTA SECCA','PASTA FRESCA / RIPIENI','ALTRO','PULIZIA E VARI'];
    Object.keys(byCat).sort((a,b)=>{const ia=order.indexOf(a.toUpperCase()), ib=order.indexOf(b.toUpperCase()); return (ia<0&&ib<0)?a.localeCompare(b):(ia<0?1:ib<0?-1:ia-ib)})
      .forEach(cat=>{
        byCat[cat].sort((x,y)=>{const rk=s=>({'TOBUY':0,'LOW':1,'OK':2}[s]??3); const d=rk(x.Stato)-rk(y.Stato); return d!==0?d:x.Nome.localeCompare(y.Nome)});
        content.appendChild(sectionFor(cat, byCat[cat]));
      });
    applyFilters();
  }

  function applyFilters(){
    const q=search.value.trim().toLowerCase();
    $$('#content li.item').forEach(li=>{
      const show=((activeFilter==='ALL')||li.dataset.status===activeFilter) && (q===''||li.dataset.name.includes(q));
      li.classList.toggle('hide', !show);
    });
    $$('#content section.card').forEach(card=>{
      const shown=$$('li.item:not(.hide)',card).length;
      const det=$('details',card); if(shown===0) det.removeAttribute('open'); else det.setAttribute('open','');
    });
  }

  btns.forEach(btn=>btn.addEventListener('click',()=>{ activeFilter=btn.dataset.filter; localStorage.setItem(FILTER_KEY,activeFilter); setPressed(activeFilter); applyFilters(); }));
  search.addEventListener('input', debounce(applyFilters,120));
  setPressed(activeFilter);

  function parseCSV(text){
    const rows=[]; let cur='',inQ=false,row=[];
    for(let i=0;i<text.length;i++){ const c=text[i],n=text[i+1];
      if(c=='"'&&inQ&&n=='"'){cur+='"';i++;continue}
      if(c=='"'){inQ=!inQ;continue}
      if(c==','&&!inQ){row.push(cur);cur='';continue}
      if((c=='\n'||c=='\r')&&!inQ){ if(cur!==''||row.length){row.push(cur);rows.push(row);row=[];cur='';} continue }
      cur+=c;
    }
    if(cur!==''||row.length){row.push(cur);rows.push(row)}
    if(!rows.length) return [];
    const H=rows[0].map(h=>h.trim());
    const iCat=H.indexOf('Categoria'), iNom=H.indexOf('Nome'), iQty=H.indexOf('Quantità'), iSc=H.indexOf('Scadenza'), iSta=H.indexOf('Stato');
    return rows.slice(1).filter(r=>r.length&&r.some(x=>(x||'').trim()!=='')).map(r=>({
      Categoria:(r[iCat]||'Altro'),
      Nome:(r[iNom]||''),
      'Quantità':(r[iQty]||''),
      Scadenza:(iSc>=0 ? (r[iSc]||'') : ''),
      Stato:((r[iSta]||'OK').toUpperCase().replace('DA COMPRARE','TOBUY').replace('SCORTA BASSA','LOW'))
    }));
  }

  function loadCSV(){
    $('#content').innerHTML = '<section class="card"><details open><summary><span class="cat-title">Caricamento…</span></summary><ul class="items"><li class="item"><div class="name">Recupero dati dal foglio…</div><div class="right"><span class="pill LOW">LIVE</span></div></li></ul></details></section>';
    fetch(csvURL, {cache:'no-store'}).then(r=>{ if(!r.ok) throw new Error('Errore caricamento CSV'); return r.text(); })
    .then(text=>{ const data=parseCSV(text); render(data); })
    .catch(err=>{ $('#content').innerHTML = '<section class="card"><details open><summary><span class="cat-title">Errore</span></summary><ul class="items"><li class="item"><div class="name">Impossibile leggere il CSV. Verifica il link pubblicato.</div><div class="right"><span class="pill TOBUY">Controlla permessi</span></div></li></ul></details></section>'; console.error(err); });
  }
  loadCSV();
});
</script>
</body>
</html>
